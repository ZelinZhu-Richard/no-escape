name: Clearway checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - name: Install backend test dependencies
        run: python -m pip install -r clearway/requirements-dev.txt
      - name: Check backend, budgets, cache, and evaluation with fixtures
        working-directory: clearway
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: clearway/web
        run: npm ci
      - name: Check frontend race handling
        working-directory: clearway/web
        run: npm test
      - name: Typecheck and build the frontend
        working-directory: clearway/web
        run: npm run build
